baseURL = "https://cybersecurity.cd.foundation/"
title = "Raven Pipeline Security | CD Foundation"

enableRobotsTXT = true
enableGitInfo = true

# Language settings
contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[taxonomies]
tag = "tags"
category = "categories"

[params.taxonomy]
taxonomyCloud = ["tags", "categories"]
taxonomyCloudTitle = ["Tag Cloud", "Categories"]
taxonomyPageHeader = ["tags", "categories"]

# SEO Configuration
[params.seo]
title_separator = " | "
description = "Embed cybersecurity into your CI/CD pipelines with industry-standard safeguards. Learn DevSecOps best practices, security tools, and frameworks for secure software development lifecycle."
keywords = [
  "CI/CD security",
  "DevSecOps",
  "cybersecurity",
  "continuous integration",
  "continuous delivery",
  "software security",
  "pipeline security",
  "NIST framework",
  "secure software development"
]
author = "CD Foundation"
image = "/images/raven-pipeline-security-logo.jpg"
twitter_card = "summary_large_image"
twitter_site = "@CDeliveryFdn"

# Syntax highlighting
pygmentsCodeFences = true
pygmentsUseClasses = false
pygmentsUseClassic = false
pygmentsStyle = "tango"

# Image processing
[imaging]
resampleFilter = "CatmullRom"
anchor = "smart"
  [imaging.jpeg]
  quality = 75
  [imaging.webp]
  quality = 75
  [imaging.avif]
  quality = 75

# Analytics
[services]
  [services.googleAnalytics]
  # id = "G-XXXXXXXXXX"

# Language configuration
[languages]
  [languages.en]
    label = "English"
    weight = 1
    [languages.en.params]
      title = "Raven Pipeline Security | CD Foundation"
      description = "Embed cybersecurity into your CI/CD pipelines with industry-standard safeguards. Learn DevSecOps best practices, security tools, and frameworks for secure software development lifecycle."
      time_format_default = "2026.03.14"
      time_format_blog = "2026.03.14"
    [[languages.en.menus.main]]
      name = "Guide"
      url = "/docs/"
      weight = 10
    [[languages.en.menus.main]]
      name = "OpenSSF Baseline"
      url = "/openssf-baseline/"
      weight = 20
    [[languages.en.menus.main]]
      name = "NIST AI RMF"
      url = "/nist-ai-rmf/"
      weight = 30
    [[languages.en.menus.main]]
      name = "Cyber Resilience Act"
      url = "/cyber-resilience-act/"
      weight = 40
  [languages.es]
    contentDir = "content/es"
    label = "Español"
    weight = 2
    [languages.es.params]
      title = "Raven Pipeline Security | Fundación CD"
      description = "Incorpora la ciberseguridad en tus pipelines de CI/CD con salvaguardas estándar de la industria. Aprende las mejores prácticas de DevSecOps, herramientas de seguridad y marcos para el ciclo de vida del desarrollo de software seguro."
      time_format_default = "03.14.2026"
      time_format_blog = "03.14.2026"
    [[languages.es.menus.main]]
      name = "Guía"
      url = "/es/docs/"
      weight = 10
    [[languages.es.menus.main]]
      name = "OpenSSF Baseline"
      url = "/es/openssf-baseline/"
      weight = 20
    [[languages.es.menus.main]]
      name = "NIST AI RMF"
      url = "/es/nist-ai-rmf/"
      weight = 30
    [[languages.es.menus.main]]
      name = "Reglamento de Ciberresiliencia"
      url = "/es/cyber-resilience-act/"
      weight = 40

# Docsy theme
[module]
proxy = "direct"

  [module.hugoVersion]
  extended = true
  min = "0.167.0"

  [[module.imports]]
  path = "github.com/google/docsy"

  [[module.imports]]
  path = "github.com/google/docsy/dependencies"

# 🔑 GOLDMARK CONFIG — THIS FIXES THE <pre> ISSUE
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    style = "tango"

# Output formats
[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "print", "RSS"]

# Site Params
[params]
copyright = "CD Foundation | Apache-2.0 license"
images = ["https://cd.foundation/wp-content/uploads/sites/78/2023/07/CDF-Home-Social-1024x536.png"]
version_menu = "Releases"
archived_version = false
version = "0.0"
url_latest_version = "https://cybersecurity.cd.foundation"

github_repo = "https://github.com/cdfoundation/CICD-Cybersecurity"
github_branch = "main"

# Search
offlineSearch = true
offlineSearchMaxResults = 20
offlineSearchSummaryLength = 200

prism_syntax_highlighting = false

# UI
[params.ui]
breadcrumb_disable = false
footer_about_enable = true
navbar_logo = true
navbar_translucent_over_cover_disable = true
sidebar_search_disable = false
# CORRECTED SIDEBAR SETTINGS:
sidebar_menu_compact = false
sidebar_menu_foldable = false

[params.ui.feedback]
enable = false

[params.ui.readingtime]
enable = false

[params.links]
  [[params.links.developer]]
  name = "GitHub"
  url = "https://github.com/cdfoundation/CICD-Cybersecurity"
  icon = "fab fa-github"
  desc = "Development takes place here!"
